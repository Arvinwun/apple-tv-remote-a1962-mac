<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无线遥控 · Siri Remote</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#8a8f99; --line:#eceef1;
    --accent:#ff6a00; --accent-soft:#fff2e8; --ok:#12b76a; --warn:#f79009;
    --radius:20px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 60px}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px}
  h1{font-size:20px; font-weight:600; margin:0; letter-spacing:.2px}
  h1 small{display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:3px}
  .pill{
    display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px;
    background:#fff; box-shadow:var(--shadow); font-size:13px; font-weight:500;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--muted)}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(18,183,106,.14)}
  .dot.warn{background:var(--warn); box-shadow:0 0 0 3px rgba(247,144,9,.14)}
  .grid{display:grid; grid-template-columns:360px 1fr; gap:18px}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px}
  .card h2{font-size:13px; font-weight:600; color:var(--muted); margin:0 0 14px; letter-spacing:.4px}
  .pad{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:16px;
    background:linear-gradient(180deg,#fbfbfc,#f3f4f6); border:1px solid var(--line);
    overflow:hidden;
  }
  .pad canvas{position:absolute; inset:0; width:100%; height:100%}
  .pad .hint{
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:var(--muted);
  }
  .meta{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .chip{font-size:12px; color:var(--muted); background:#f7f8fa; border-radius:8px; padding:4px 9px}
  .row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .label{font-size:14px}
  .row .sub{font-size:12px; color:var(--muted); margin-top:2px}
  select,input[type=text]{
    font:inherit; font-size:13px; color:var(--ink); background:#f7f8fa;
    border:1px solid var(--line); border-radius:10px; padding:7px 10px; min-width:120px;
    outline:none;
  }
  select:focus,input[type=text]:focus{border-color:#ffc9a3; background:#fff}
  .switch{position:relative; width:46px; height:28px; border-radius:999px; background:#e3e6ea; cursor:pointer; transition:.18s; flex:none}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.18); transition:.18s}
  .switch.on{background:var(--accent)}
  .switch.on::after{left:21px}
  input[type=range]{-webkit-appearance:none; width:150px; height:4px; border-radius:2px; background:#e9ecf0; outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2); border:1px solid #e6e9ee}
  .banner{
    display:none; align-items:center; gap:10px; margin-bottom:16px; padding:12px 16px;
    background:#fff4e5; border:1px solid #ffd7a8; border-radius:14px; font-size:13px; color:#8a4b00;
  }
  .banner.show{display:flex}
  .banner a{margin-left:auto; color:var(--accent); font-weight:600; text-decoration:none}
  .footer{display:flex; align-items:center; gap:14px; margin-top:22px}
  button.primary{
    font:inherit; font-weight:600; font-size:14px; color:#fff; background:var(--accent);
    border:0; border-radius:999px; padding:12px 26px; cursor:pointer;
    box-shadow:0 6px 16px rgba(255,106,0,.25);
  }
  button.primary:active{transform:translateY(1px)}
  .toast{
    position:fixed; left:50%; bottom:36px; transform:translate(-50%,20px); opacity:0;
    background:#16181d; color:#fff; font-size:13px; padding:10px 18px; border-radius:999px;
    transition:.22s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .note{font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>无线遥控 · Siri Remote<small>初代 A1513 / A1962 · BLE HID</small></h1>
    <div class="pill"><span class="dot" id="dot"></span><span id="statusText">检测中…</span></div>
  </header>

  <div class="banner" id="permBanner">
    <span>缺少辅助功能权限：合成的按键会被系统丢弃，遥控器看起来「没反应」。</span>
    <a href="x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility">打开设置 →</a>
  </div>

  <div class="grid">
    <div class="card">
      <h2>触摸板</h2>
      <div class="pad">
        <canvas id="pad"></canvas>
        <div class="hint" id="padHint">手指放上去试试</div>
      </div>
      <div class="meta">
        <span class="chip" id="chipCols">集合 —</span>
        <span class="chip" id="chipPid">主程序 —</span>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:18px">
        <h2>模式</h2>
        <div class="row">
          <div><div class="label">鼠标模式</div><div class="sub">滑动移动指针，而不是按方向键</div></div>
          <div class="switch" id="swMouse"></div>
        </div>
        <div class="row">
          <div><div class="label">指针速度</div><div class="sub">满行程约 <span id="speedPx">1400</span> px</div></div>
          <input type="range" id="speed" min="0.4" max="1.6" step="0.05">
        </div>
        <div class="row">
          <div><div class="label">加速度</div><div class="sub">快速划动时放大位移</div></div>
          <div class="switch" id="swAccel"></div>
        </div>
        <div class="row">
          <div><div class="label">按下防飘</div><div class="sub">按压瞬间把指针拉回落点</div></div>
          <div class="switch" id="swSnap"></div>
        </div>
        <div class="row">
          <div><div class="label">手掌误触过滤</div><div class="sub">接触面积超过 <span id="palmVal">0.020</span> 就不响应（指尖约 0.0038）</div></div>
          <div class="switch" id="swPalm"></div>
        </div>
      </div>

      <div class="card">
        <h2>键位</h2>
        <div id="keys"></div>
        <div class="row" style="margin-top:6px">
          <div><div class="label">TV 键轮换的 App</div><div class="sub">逗号分隔，按名字匹配已打开的 App</div></div>
          <input type="text" id="tvApps" style="min-width:220px" placeholder="ChatGPT,WorkBuddy,Claude">
        </div>
        <div class="row">
          <div><div class="label">麦克风键</div><div class="sub">长按类动作会在松开时抬起</div></div>
          <select id="siriAction">
            <option value="hold-option">按住 Option</option>
            <option value="cmd-d">按一下 ⌘D</option>
            <option value="double-option">双击 Option</option>
            <option value="hold-control">按住 Control</option>
            <option value="hold-fn">按住 Fn</option>
            <option value="off">不响应</option>
          </select>
        </div>
      </div>

      <div class="footer">
        <button class="primary" id="save">保存</button>
        <span class="note">保存后重启主程序生效</span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast">已保存</div>

<script>
const KEY_LABELS = {
  up:["滑动/快滑 上","方向键 ↑"], down:["滑动 下","方向键 ↓"],
  left:["滑动 左","方向键 ←"], right:["滑动 右","方向键 →"],
  click:["按下触摸板",""],
  menu:["Menu",""],
  tv:["TV",""],
  playpause:["播放/暂停",""],
  volup:["音量 +",""],
  voldown:["音量 −",""],
  siri:["麦克风键",""]
};
const CHOICES = [
  ["up","方向键 ↑"],["down","方向键 ↓"],["left","方向键 ←"],["right","方向键 →"],
  ["return","回车"],["escape","Esc"],["home","Home"],["pageup","PageUp"],["pagedown","PageDown"],
  ["space","空格"],["tab","Tab"],["delete","删除"],
  ["apps","轮换 App"],["off","不响应"]
];
const SPAN = 1650;

let cfg = {};
let dragging = false;

function el(id){ return document.getElementById(id); }

function makeSelect(current, name){
  const s = document.createElement('select');
  const raw = current || "off";
  const val = raw.startsWith("apps:") ? "apps" : (raw === null ? "off" : raw);
  for (const [v, label] of CHOICES){
    const o = document.createElement('option');
    o.value = v; o.textContent = label;
    if (v === val) o.selected = true;
    s.appendChild(o);
  }
  const known = CHOICES.some(([v]) => v === val);
  if (!known){
    const o = document.createElement('option');
    o.value = raw; o.textContent = raw; o.selected = true;
    s.appendChild(o);
  }
  s.dataset.key = name;
  return s;
}

function renderKeys(km){
  const box = el('keys');
  box.innerHTML = '';
  for (const name of Object.keys(KEY_LABELS)){
    const [title, sub] = KEY_LABELS[name];
    const row = document.createElement('div');
    row.className = 'row';
    const left = document.createElement('div');
    left.innerHTML = `<div class="label">${title}</div>` + (sub ? `<div class="sub">${sub}</div>` : '');
    row.appendChild(left);
    row.appendChild(makeSelect(km[name] === undefined ? null : km[name], name));
    box.appendChild(row);
  }
}

function paint(){
  el('swMouse').classList.toggle('on', !!cfg.mouse);
  el('swAccel').classList.toggle('on', !!cfg.accel);
  el('swSnap').classList.toggle('on', cfg.snap !== false);
  el('swPalm').classList.toggle('on', cfg.palm_guard !== false);
  el('palmVal').textContent = (cfg.palm_size != null ? Number(cfg.palm_size) : 0.02).toFixed(3);
  el('speed').value = cfg.speed || 0.85;
  el('speedPx').textContent = Math.round((cfg.speed || 0.85) * SPAN / 50) * 50;
  el('tvApps').value = (cfg.tv_apps || []).join(',');
  el('siriAction').value = cfg.siri_action || 'hold-option';
  renderKeys(cfg.keymap || {});
}

async function load(){
  cfg = await (await fetch('/api/config')).json();
  paint();
}

async function status(){
  try{
    const s = await (await fetch('/api/status')).json();
    el('chipCols').textContent = '集合 ' + (s.collections || 0);
    el('chipPid').textContent = s.running ? '主程序运行中 · ' + s.pid : '主程序未运行';
    const dot = el('dot'); const txt = el('statusText');
    el('permBanner').classList.toggle('show', s.main_trusted === false);
    dot.className = 'dot';
    if (s.running){ dot.classList.add('ok'); txt.textContent = '已接管'; }
    else if (s.present){ dot.classList.add('warn'); txt.textContent = '遥控器在线，主程序未启动'; }
    else { txt.textContent = '遥控器休眠'; }
  }catch(e){}
}

// ---- 触摸预览
const cvs = el('pad'), ctx = cvs.getContext('2d');
let trail = [];
function sizeCanvas(){
  const r = cvs.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cvs.width = r.width * dpr; cvs.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function draw(){
  const r = cvs.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!trail.length) return;
  // 轨迹
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++){
    const a = trail[i-1], b = trail[i];
    ctx.strokeStyle = `rgba(255,106,0,${0.05 + 0.35 * (i / trail.length)})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const p = trail[trail.length-1];
  if (p.down){
    ctx.beginPath(); ctx.fillStyle = 'rgba(255,106,0,.16)';
    ctx.arc(p.x, p.y, 26, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = '#ff6a00';
    ctx.arc(p.x, p.y, 9, 0, Math.PI*2); ctx.fill();
    el('padHint').textContent = `x ${Math.round((p.nx-0.5)*SPAN)}   y ${Math.round((0.5-p.ny)*SPAN)}`;
  } else {
    el('padHint').textContent = '手指放上去试试';
  }
}

function onTouch(e){
  const r = cvs.getBoundingClientRect();
  const nx = (e.x + SPAN/2) / SPAN;          // 0..1 左→右
  const ny = 1 - (e.y + SPAN/2) / SPAN;      // e.y 向上为正
  trail.push({ x: nx * r.width, y: ny * r.height, down: e.down, nx, ny });
  if (trail.length > 60) trail.shift();
  draw();
}

if (window.EventSource){
  const es = new EventSource('/events');
  es.onmessage = ev => {
    try{ onTouch(JSON.parse(ev.data)); }catch(e){}
  };
}

// ---- 交互
function bindSwitch(id, key, invert){
  el(id).onclick = () => {
    const cur = el(id).classList.contains('on');
    const next = !cur;
    el(id).classList.toggle('on', next);
    cfg[key] = invert ? !next : next;
  };
}
bindSwitch('swMouse', 'mouse');
bindSwitch('swAccel', 'accel');
bindSwitch('swSnap', 'snap', true);
bindSwitch('swPalm', 'palm_guard');
el('speed').oninput = e => {
  cfg.speed = parseFloat(e.target.value);
  el('speedPx').textContent = Math.round(cfg.speed * SPAN / 50) * 50;
};

async function fetchJSON(url, opts, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 4000);
  try {
    const r = await fetch(url, Object.assign({signal: ctl.signal}, opts || {}));
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

el('save').onclick = async () => {
  const km = {};
  document.querySelectorAll('select[data-key]').forEach(s => {
    const k = s.dataset.key;
    if (s.value === 'apps') km[k] = 'apps:' + (el('tvApps').value || '');
    else if (s.value === 'off') km[k] = null;
    else km[k] = s.value;
  });
  const body = {
    ...cfg,
    tv_apps: (el('tvApps').value || '').split(',').map(s => s.trim()).filter(Boolean),
    siri_action: el('siriAction').value,
    keymap: km
  };
  const r = await fetch('/api/config', {method:'POST', body: JSON.stringify(body)});
  const ok = (await r.json()).ok;
  const t = el('toast');
  t.textContent = ok ? '已保存 · 重启主程序生效' : '保存失败';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
  cfg = body;
};

window.addEventListener('resize', sizeCanvas);
load(); sizeCanvas(); status(); setInterval(status, 3000);
</script>
</body>
</html>
